<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Processos">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Processos de Bolso</title>
<style>
:root{
  --bg:#0A0A0C; --surface:#141417; --surface-2:#1D1D22; --surface-3:#26262D; --ink:#F4F4F6; --muted:#9696A1; --dim:#62626C;
  --line:#24242A; --line-strong:#34343C;
  --gold:#F2C45A; --gold-ink:#1A1405; --gold-soft:rgba(242,196,90,.13);
  --sky:#8EC5FF; --sky-soft:rgba(142,197,255,.12);
  --green:#7BD88F; --green-soft:rgba(123,216,143,.13);
  --coral:#FF7A66; --coral-soft:rgba(255,122,102,.13);
  --scrim:rgba(0,0,0,.62);
  --radius:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% -10%,rgba(242,196,90,.16),rgba(242,196,90,.04) 55%,transparent 75%)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:14px} .tiny{font-size:12.5px}
.gold{color:var(--gold)} .bad{color:var(--coral)} .ok{color:var(--green)}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
  display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.02em}
h2{font-size:18px;line-height:1.25;margin:0;font-weight:650}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.head .grow{flex:1;min-width:0}

/* botões */
.btn{appearance:none;border:0;font-weight:650;font-size:16px;border-radius:999px;padding:12px 18px;min-height:48px;
  background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--gold);padding-left:6px;padding-right:6px}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.tile:focus-visible,.row-btn:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.icon-btn.plain{border:0;background:transparent}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--gold);font-weight:600;text-align:left;cursor:pointer;font-size:15px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* início: os quatro quadrados */
.brand{display:flex;flex-direction:column;gap:2px}
.brand .muted{font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* quadrado: [ícone ........ data]  /  título logo abaixo  /  (espaço)  /  ● fase no rodapé */
.tile{--tc:var(--gold);--tcs:var(--gold-soft);appearance:none;position:relative;aspect-ratio:1/1;border-radius:26px;border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;
  background:radial-gradient(120% 90% at 0% 0%,var(--tcs),transparent 55%),linear-gradient(165deg,var(--surface-2),var(--surface) 75%);
  padding:14px 14px 13px;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile.st-perdido{--tc:var(--coral);--tcs:var(--coral-soft)}
.tile.st-encerrado,.tile.st-ganho{--tc:var(--green);--tcs:var(--green-soft)}
.tile.tem-novo{border-color:rgba(242,196,90,.55);box-shadow:0 0 0 1px rgba(242,196,90,.25),0 8px 26px rgba(242,196,90,.12)}
.t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.tile .t-ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--tc);background:var(--tcs);border:1px solid color-mix(in srgb,var(--tc) 22%,transparent)}
.t-data{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;white-space:nowrap}
.tile .t-new{background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;letter-spacing:.04em;margin-top:3px}
.tile .t-tit{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:12px;font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .t-fase{margin-top:auto;padding-top:10px;display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.25;color:var(--ink);opacity:.82}
.tile .t-fase i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-top:4px;box-shadow:0 0 0 3px var(--tcs)}
.tile .t-fase{overflow:hidden}
.tile.t-add{border-style:dashed;border-color:var(--line-strong);background:transparent;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);font-weight:650;font-size:15px;line-height:1.25}
.p-head{--tc:var(--gold);--tcs:var(--gold-soft);display:flex;align-items:center;gap:12px}
.p-head.st-perdido{--tc:var(--coral);--tcs:var(--coral-soft)} .p-head.st-encerrado,.p-head.st-ganho{--tc:var(--green);--tcs:var(--green-soft)}
.p-ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none;color:var(--tc);background:var(--tcs);border:1px solid color-mix(in srgb,var(--tc) 22%,transparent)}
.p-head h1{font-size:25px}
.tile.t-add .t-ico{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
.home-foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:13px;text-align:center}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.resumo p{margin:0;font-size:16.5px;line-height:1.55}
.decisao{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:16.5px;line-height:1.5}
.decisao b{color:var(--gold)}
.meta{font-size:12.5px;color:var(--dim);margin-top:10px}
.num-chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.status{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--gold-soft);color:var(--gold)}
.status.perdido{background:var(--coral-soft);color:var(--coral)}
.status.encerrado,.status.ganho{background:var(--green-soft);color:var(--green)}
.banner{appearance:none;width:100%;text-align:left;border:1px solid rgba(242,196,90,.35);background:var(--gold-soft);color:var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.banner p{margin:0;font-size:15px}

/* movimentações */
.tl{list-style:none;margin:0;padding:4px 0 0}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.tl li::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li:first-child::before{background:var(--gold)}
.tl li.novo::before{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tl .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .t{font-size:15.5px;line-height:1.4}
.tl .tag{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* listas */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row-btn{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:58px;color:inherit}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rb-main b{font-weight:600}
.rb-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}

/* campos */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;color:var(--muted)}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink);min-height:48px;outline:none}
.input:focus{border-color:var(--gold)}
textarea.input{resize:none;line-height:1.4}
select.input{appearance:none}
.err{color:var(--coral);font-size:14px;margin:0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{appearance:none;width:52px;height:32px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;flex:none;border:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--gold)}
.switch:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:999px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.seg button:disabled{opacity:.35}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--green-soft);color:var(--green)} .chip.bad{background:var(--coral-soft);color:var(--coral)}

/* folha (sheet), confirmação, toast */
#sheet-root,#confirm-root{position:fixed;inset:0;z-index:40}
#confirm-root{z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:560px;background:var(--surface);border:1px solid var(--line-strong);border-bottom:0;border-radius:26px 26px 0 0;
  max-height:calc(100% - var(--kb,0px) - env(safe-area-inset-top, 0px) - 18px);display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet.full{height:calc(100% - var(--kb,0px) - env(safe-area-inset-top, 0px) - 18px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 20px}
.sheet-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(22px + env(safe-area-inset-bottom, 0px));overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);background:var(--surface)}
.confirm{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:380px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.confirm p{margin:0}
.confirm .row>*{flex:1}
.confirm .input{background:var(--bg)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 10px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);font-weight:650;font-size:15px;padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* conversa com o GPT */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:18px;padding:11px 14px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.msg.eu{align-self:flex-end;background:var(--gold-soft);border:1px solid rgba(242,196,90,.25);border-bottom-right-radius:6px}
.msg.ia{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.ia p{margin:0 0 8px} .msg.ia p:last-child{margin:0}
.msg.ia ul{margin:0 0 8px;padding-left:20px} .msg.ia li{margin:2px 0}
.msg .fontes{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{appearance:none;border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13.5px;cursor:pointer}
.chip-btn.gold{color:var(--gold);border-color:rgba(242,196,90,.4)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;max-height:140px;min-height:48px}
.ask .icon-btn{background:var(--gold);color:var(--gold-ink);border:0;width:48px;height:48px}
.thinking{align-self:flex-start;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}

/* leitor dos autos */
.page-text{white-space:pre-wrap;font-size:15px;line-height:1.55;background:var(--surface-2);border-radius:16px;padding:14px;overflow-wrap:anywhere;font-family:ui-serif,Georgia,"Times New Roman",serif}
.page-text mark,.snip mark{background:rgba(242,196,90,.35);color:inherit;border-radius:3px}
.snip{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* trava */
#lock-root{position:fixed;inset:0;z-index:100}
.lock{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lock::before{content:"";position:absolute;inset:0 0 auto 0;height:360px;background:radial-gradient(110% 90% at 50% -10%,rgba(242,196,90,.22),transparent 70%);pointer-events:none}
.lock-box{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-box p{margin:0}
.lock-ico{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;margin:0 auto;color:var(--gold-ink);background:var(--gold)}
.lock-input{text-align:center;font-size:24px;letter-spacing:.25em}
details summary{cursor:pointer}
@media (min-width:700px){ .tiles{gap:16px} }
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<div id="sheet-root" hidden></div>
<div id="confirm-root" hidden></div>
<div id="lock-root" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
const APP_ID = 'processos-de-bolso';
const APP_VERSION = '1.2';
const PREVIEW = !!window.PREVIEW_MODE;

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const fmtDK = k => k ? `${k.slice(8, 10)}/${k.slice(5, 7)}/${k.slice(0, 4)}` : '—';
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDate = d => new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function quando(iso) {
  if (!iso) return 'nunca';
  const k = dayKey(new Date(iso)), d = daysBetween(k, dayKey());
  const dia = d === 0 ? 'hoje' : d === 1 ? 'ontem' : fmtDate(iso);
  return `${dia} às ${fmtTime(iso)}`;
}
const soDigitos = s => String(s || '').replace(/\D/g, '');
const fmtCNJ = d => d.length === 20 ? `${d.slice(0, 7)}-${d.slice(7, 9)}.${d.slice(9, 13)}.${d.slice(13, 14)}.${d.slice(14, 16)}.${d.slice(16)}` : d;
function cnjValido(d) {
  if (!/^\d{20}$/.test(d)) return false;
  const n = d.slice(0, 7), dv = d.slice(7, 9), resto = d.slice(9);
  const num = BigInt(n + resto + '00');
  return String(98n - (num % 97n)).padStart(2, '0') === dv;
}
async function sha256hex(str) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); }

/* ---------- ícones ---------- */
/* ícones dos quadrados: duas camadas (miolo preenchido suave + contorno) */
const F = d => `<path d="${d}" fill="currentColor" fill-opacity=".22" stroke="none"/>`;
const P = {
  casa: F('M4.5 10.6 12 4.4l7.5 6.2V20.5h-15z') + '<path d="M2.8 11.9 12 4.3l9.2 7.6"/><path d="M4.8 10.3v10.2h14.4V10.3"/><path d="M10 20.5v-5.2a2 2 0 0 1 4 0v5.2"/><path d="M16.5 4.8v3"/>',
  pessoa: F('M3.5 12 9.5 7l6 5v8.5h-12z') + '<path d="M2 13.2 9.5 7 17 13.2"/><path d="M3.8 11.8v8.7h8"/><path d="M7.8 20.5v-3.8h3.4v3.8"/><circle cx="18" cy="12.2" r="2.3"/><path d="M14.3 20.5c.4-2.5 1.9-4 3.7-4s3.3 1.5 3.7 4"/>',

/* ---------- armazenamento local (IndexedDB) ---------- */
const Store = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open('processos', 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv', mode); const req = fn(t.objectStore('kv')); let out; if (req) req.onsuccess = () => { out = req.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get(k) { return this.run('readonly', o => o.get(k)); },
  put(k, v) { return this.run('readwrite', o => o.put(v, k)); },
  del(k) { return this.run('readwrite', o => o.delete(k)); }
};
const Mem = new Map(); /* fallback se o IndexedDB falhar (modo privado) */
async function kvGet(k) { try { return await Store.get(k); } catch (_) { return Mem.get(k); } }
async function kvPut(k, v) { Mem.set(k, v); try { await Store.put(k, v); } catch (_) {} }
async function kvDel(k) { Mem.delete(k); try { await Store.del(k); } catch (_) {} }

function normProc(p) {

  p.numerosDjen = (p.numerosDjen && p.numerosDjen.length ? p.numerosDjen : [soDigitos(p.numero)]).filter(Boolean);

}

function mdHTML(s) { /* markdown simples: parágrafos, **negrito**, listas com - */
  const linhas = esc(String(s || '').trim()).split('\n');
  let html = '', lista = false;
  for (let l of linhas) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*(\S.+?)\*(?=\s|$|[.,;:])/g, '$1<i>$2</i>');
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!lista) { html += '<ul>'; lista = true; } html += `<li>${m[1]}</li>`; continue; }
    if (lista) { html += '</ul>'; lista = false; }
    if (l.trim()) html += `<p>${l.replace(/^#{1,4}\s*/, '')}</p>`;
  }
  if (lista) html += '</ul>';
  return html;
}

/* ---------- Diário da Justiça (DJEN — API pública do CNJ, funciona direto do navegador) ---------- */
const DJEN_URL = 'https://comunicaapi.pje.jus.br/api/v1/comunicacao';
function stripHtml(s) {
  const d = new DOMParser().parseFromString('<div>' + String(s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n') + '</div>', 'text/html');
  return (d.body.textContent || '').replace(/[ \t ]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();
}
async function djenFetch(num) {
  if (window.DJEN_MOCK) return window.DJEN_MOCK(num);
  let all = [];
  for (let pg = 1; pg <= 10; pg++) {
    const r = await fetch(`${DJEN_URL}?numeroProcesso=${num}&pagina=${pg}&itensPorPagina=100`, { cache: 'no-store' });
    if (!r.ok) throw new Error('djen ' + r.status);
    const j = await r.json(); const it = j.items || [];
    all = all.concat(it); if (it.length < 100) break;
  }
  return all.map(x => ({ id: x.id, d: x.data_disponibilizacao || (x.datadisponibilizacao || '').slice(0, 10), orgao: x.nomeOrgao || '', tipo: x.tipoComunicacao || '', classe: x.nomeClasse || '', doc: x.tipoDocumento || '', n: num, link: x.link || '', texto: stripHtml(x.texto) }));
}
function rotuloPub(x) {
  const t = x.texto.toUpperCase().slice(0, 4000);
  const pauta = x.texto.match(/pautado para a Sess[ãa]o[\s\S]{0,140}?do dia (\d\d)-(\d\d)-(\d{4})/i);
  if (pauta) return `Julgamento marcado pra ${pauta[1]}/${pauta[2]}/${pauta[3]}.`;
  if (/AC[ÓO]RD[ÃA]O|ACORDAM OS DESEMBARGADORES/.test(t)) return 'Acórdão (decisão do tribunal) publicado.';
  if (/\bSENTEN[ÇC]A\b/.test(t)) return 'Sentença publicada.';
  if (/\bDECIS[ÃA]O\b/.test(t)) return 'Decisão publicada.';
  if (/\bDESPACHO\b/.test(t)) return 'Despacho publicado.';
  if (/CONTRARRAZ/.test(t)) return 'Intimação pra responder a recurso.';
  if (/AUDI[ÊE]NCIA/.test(t)) return 'Intimação sobre audiência.';
  if (/ATO ORDINAT[ÓO]RIO/.test(t)) return 'Intimação (ato do cartório).';
  if (/CITA[ÇC][ÃA]O|\bCITO\b/.test(t)) return 'Citação.';
  return (x.tipo || 'Publicação') + '.';
}
function diarioDoc(p, pubs) {
  const lst = [...pubs].sort((a, b) => (a.d + a.id).localeCompare(b.d + String(b.id)));
  return { id: p.id + '-diario', pid: p.id, tipo: 'diario', titulo: 'Diário da Justiça', pecas: lst.map((x, i) => ({ p: i + 1, peca: rotuloPub(x).replace(/\.$/, ''), data: fmtDK(x.d) })),
    pages: lst.map(x => `${fmtDK(x.d)} · ${x.orgao}${x.classe ? ' · ' + x.classe : ''}\n\n${x.texto}`), ids: lst.map(x => x.id) };
}
async function putAutos(doc) {
  const h = await sha256hex(JSON.stringify(doc.pages));
  doc.hash = h; await kvPut('autos:' + doc.id, doc);
  Busca.cache.delete(doc.pid);
  return h;
}
function setAutosMeta(p, doc) {
  let a = p.autos.find(x => x.id === doc.id);
  if (!a) {
    a = { id: doc.id };
    const iDia = p.autos.findIndex(x => x.tipo === 'diario');
    if (doc.tipo === 'diario' || iDia < 0) p.autos.push(a); else p.autos.splice(iDia, 0, a); /* autos antes do Diário */
  }
  Object.assign(a, { titulo: doc.titulo, tipo: doc.tipo || 'autos', pags: doc.pages.length, hash: doc.hash });
  return a;
}

const Upd = { running: false, pid: null, ia: new Set(), lastAll: null };
/* confere o Diário de um processo; devolve as publicações novas */
async function checkProc(p, { baseline = false } = {}) {
  let pubs = [];
  for (const n of p.numerosDjen) pubs = pubs.concat(await djenFetch(n));
  const vistos = new Map(); pubs = pubs.filter(x => !vistos.has(x.id) && vistos.set(x.id, 1));
  const conhecidos = new Set(p.djenIds);
  const desde = p.djenDesde || '';
  const novos = baseline ? [] : pubs.filter(x => !conhecidos.has(x.id) && x.d > desde).sort((a, b) => a.d.localeCompare(b.d));
  p.djenIds = [...new Set([...p.djenIds, ...pubs.map(x => x.id)])];
  p.consultado = new Date().toISOString(); p.consultaErro = null;
  if (pubs.length) {
    const doc = diarioDoc(p, pubs); const old = await kvGet('autos:' + doc.id);
    if (!old || JSON.stringify(old.ids) !== JSON.stringify(doc.ids)) { await putAutos(doc); setAutosMeta(p, doc); }
  }
  if (novos.length) {
    for (const x of novos) p.movs.push({ d: x.d, t: rotuloPub(x), djen: x.id, novo: true });
    p.pendIA = [...new Set([...(p.pendIA || []), ...novos.map(x => x.id)])]; /* o GPT ainda vai resumir estas */
    p.novo = true; p.novidadeEm = new Date().toISOString(); touch(p);
  }
  return { pubs, novos };
}
async function refreshAll({ manual = false, only = null } = {}) {
  if (Upd.running) { if (manual) toast('Já estou atualizando…'); return; }
  if (!navigator.onLine && !window.DJEN_MOCK) { if (manual) toast('Sem internet agora.'); return; }
  Upd.running = true; paintRefresh();
  const achados = [];
  try {
    for (const p of procs()) {
      if (only && p.id !== only) continue;
      try {
        const { novos } = await checkProc(p);
        if (novos.length) achados.push(p);
      } catch (e) { p.consultaErro = 'Não consegui consultar o Diário agora.'; }
    }
    if (!only) Upd.lastAll = new Date().toISOString();
    await kvPut('ultimaConsulta', Upd.lastAll);
    await save(); render();
    if (achados.length) toast(`Novidade: ${esc(achados.map(p => p.titulo).join(' · '))}`, 4200);
    else if (manual) toast('Tudo conferido. Nada novo.');
  } finally { Upd.running = false; paintRefresh(); }
  badge();
  if (iaOn()) for (const p of S.processos.filter(x => (x.pendIA || []).length)) await iaAtualizar(p).catch(() => {});
}
function paintRefresh() { $$('[data-refresh-ico]').forEach(el => el.classList.toggle('spin', Upd.running)); $$('[data-refresh-txt]').forEach(el => { el.textContent = Upd.running ? 'Conferindo o Diário…' : conferidoTxt(); }); }
function conferidoTxt() { const t = Upd.lastAll; return t ? `Conferido ${quando(t)}` : 'Toque pra conferir as novidades'; }
function badge() { try { const n = S.processos.filter(p => p.novo).length; if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (_) {} }

/* ---------- GPT (OpenAI) — a chave fica só no aparelho e no cofre criptografado ---------- */
const OAI = 'https://api.openai.com/v1';
const iaOn = () => !!(S.settings.openaiKey && S.settings.autoIA !== false);
async function oaiModels(key) {
  const r = await fetch(OAI + '/models', { headers: { Authorization: 'Bearer ' + key } });
  if (r.status === 401) throw Object.assign(new Error('chave'), { code: 'key' });
  if (!r.ok) throw new Error('models ' + r.status);
  return ((await r.json()).data || []).map(m => m.id);
}
function escolheModelo(ids, tipo) {
  const ver = id => { const m = id.match(/^gpt-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const re = tipo === 'melhor' ? /^gpt-\d+(\.\d+)?$/ : /^gpt-\d+(\.\d+)?-mini$/;
  const c = ids.filter(id => re.test(id)).sort((a, b) => ver(b) - ver(a));
  if (c.length) return c[0];
  for (const f of ['gpt-5-mini', 'gpt-4.1-mini', 'gpt-4o-mini', 'gpt-4.1', 'gpt-4o']) if (ids.includes(f)) return f;
  return ids.find(id => /^gpt-/.test(id)) || 'gpt-4o-mini';
}
async function oaiChat(messages, { json = false } = {}) {
  if (window.OAI_MOCK) return window.OAI_MOCK(messages, { json });
  const key = S.settings.openaiKey; if (!key) throw Object.assign(new Error('sem chave'), { code: 'nokey' });
  const body = { model: S.settings.modelo || 'gpt-4o-mini', messages };
  if (json) body.response_format = { type: 'json_object' };
  if (/^(gpt-5|o\d)/.test(body.model)) body.reasoning_effort = 'low';
  const call = () => fetch(OAI + '/chat/completions', { method: 'POST', headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let r = await call();
  if (r.status === 400) {
    const t = await r.text();
    if (/reasoning_effort|response_format|unsupported/i.test(t)) { delete body.reasoning_effort; if (/response_format/i.test(t)) delete body.response_format; r = await call(); }
    else throw Object.assign(new Error(t.slice(0, 200)), { code: 'bad' });
  }
  if (r.status === 401) throw Object.assign(new Error('chave'), { code: 'key' });
  if (r.status === 429) throw Object.assign(new Error('limite'), { code: 'quota' });
  if (!r.ok) throw new Error('openai ' + r.status);
  const j = await r.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}
const iaErro = e => e.code === 'key' ? 'A chave da OpenAI não foi aceita. Troque em Ajustes.' : e.code === 'quota' ? 'A OpenAI recusou por limite ou falta de crédito na conta.' : e.code === 'nokey' ? 'Falta a chave da OpenAI em Ajustes.' : 'Não consegui falar com o GPT agora. Tente de novo.';
const SYS_BASE = 'Você ajuda o dono destes processos, uma pessoa leiga (não é advogado), a entender os processos judiciais brasileiros dele. Escreva em português do Brasil, direto, frases curtas, sem juridiquês — quando usar um termo técnico, explique em poucas palavras. Nunca invente fatos, datas, valores, nomes ou números: use só o que está no material. Quando for previsão, diga que é provável, não certo.';
function ctxProc(p, nMovs = 12) {

async function iaAtualizar(p, { inicial = false } = {}) {

    const pubs = doc ? doc.pages.map((t, i) => ({ id: doc.ids[i], t })) : [];
    const novosIds = new Set(p.pendIA || []);
    const alvo = inicial ? pubs.slice(-12) : pubs.filter(x => novosIds.has(x.id));
    if (!alvo.length && !inicial) return;
    const material = alvo.map(x => x.t.slice(0, inicial ? 7000 : 14000)).join('\n\n-----\n\n');
    const instr = inicial
      ? 'É a primeira vez que este processo entra no app. Com base nas publicações do Diário da Justiça abaixo (as mais recentes no fim), escreva o resumo da história do processo, a decisão e a fase atual, e uma linha por publicação importante.'
      : 'Saíram publicações novas no Diário da Justiça (abaixo). Atualize o resumo incorporando a novidade, reescreva a decisão e a fase, e escreva uma linha simples por publicação nova.';
    const msgs = [{ role: 'system', content: SYS_BASE }, { role: 'user', content: `${ctxProc(p)}\n\n${instr}\n\nPUBLICAÇÕES:\n${material}\n\nResponda SÓ com um JSON assim: {"resumo": "até 900 caracteres, a história toda até agora", "decisao": "1 ou 2 frases: o que foi decidido de fato na novidade mais importante; se não houve decisão, o próximo passo mais provável começando com 'Provável:'", "fase": "até 30 caracteres, ex: Apelação no TJRN", "status": "andamento | encerrado | perdido | ganho", "movs": [{"d": "AAAA-MM-DD", "t": "o que aconteceu, em palavras simples"}]}` }];
    const out = JSON.parse((await oaiChat(msgs, { json: true })).replace(/^```json\s*|```$/g, ''));
    if (!out.resumo) return;
    p.historico.unshift({ em: new Date().toISOString(), resumo: p.resumo, decisao: p.decisao, fase: p.fase, fonte: p.fonteResumo });
    p.historico = p.historico.slice(0, 10);
    p.resumo = String(out.resumo); p.decisao = String(out.decisao || p.decisao || ''); if (out.fase) p.fase = String(out.fase).slice(0, 40);
    if (['andamento', 'encerrado', 'perdido', 'ganho'].includes(out.status)) p.status = out.status;
    if (Array.isArray(out.movs) && out.movs.length) {
      if (inicial) p.movs = [];
      else p.movs = p.movs.filter(m => !(m.djen && novosIds.has(m.djen)));
      for (const m of out.movs) if (m && m.t) p.movs.push({ d: /^\d{4}-\d\d-\d\d$/.test(m.d) ? m.d : dayKey(), t: String(m.t), ia: true, novo: !inicial });
    }
    p.fonteResumo = 'GPT'; p.atualizado = new Date().toISOString(); p.pendIA = []; p.iaErro = null; touch(p);
    await save();
  } catch (e) { p.iaErro = iaErro(e); } finally { Upd.ia.delete(p.id); render(); }
}

/* ---------- busca nos autos (pro GPT achar os trechos certos) ---------- */
const STOP = new Set('que para pra com sem aos das dos nas nos pela pelo pelas pelos por uma umas uns ele ela eles elas isso isto esse essa este esta seu sua seus suas mais mas como quando onde porque ser foi sao tem ter tinha sobre entre depois antes entao tudo todo toda todos todas muito pouco qual quais quem meu minha voce voces nao sim tambem ja ate apos art autos processo pagina fls folha'.split(' '));
const toks = s => semAcento(s).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.slice(0, 7));
const Busca = {
  cache: new Map(),
  async unidades(p) {
    if (this.cache.has(p.id)) return this.cache.get(p.id);
    const us = [];
    for (const a of p.autos) {
      const d = await kvGet('autos:' + a.id); if (!d) continue;
      d.pages.forEach((t, i) => { if (t && t.trim()) us.push({ aid: a.id, doc: d.titulo, pag: i + 1, t }); });
    }
    const df = new Map(); let tot = 0;
    for (const u of us) { const tf = new Map(); for (const w of toks(u.t)) tf.set(w, (tf.get(w) || 0) + 1); u.tf = tf; u.len = [...tf.values()].reduce((a, b) => a + b, 0); tot += u.len; for (const w of tf.keys()) df.set(w, (df.get(w) || 0) + 1); }
    const idx = { us, df, N: us.length, avg: us.length ? tot / us.length : 1 };
    this.cache.set(p.id, idx); return idx;
  },
  async top(p, q, limite = 42000) {
    const idx = await this.unidades(p); const qs = [...new Set(toks(q))];
    const sc = idx.us.map(u => { let s = 0; for (const w of qs) { const f = u.tf.get(w); if (!f) continue; const n = idx.df.get(w) || 1; const idf = Math.log(1 + (idx.N - n + .5) / (n + .5)); s += idf * (f * 2.2) / (f + 1.2 * (.25 + .75 * u.len / idx.avg)); } return [s, u]; })
      .filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]);
    const out = []; let n = 0;
    for (const [, u] of sc) { const t = u.t.slice(0, 7000); if (n + t.length > limite && out.length) break; out.push({ ...u, t }); n += t.length; if (out.length >= 14) break; }
    if (!out.length) { /* pergunta genérica: manda o começo do Diário e as últimas páginas */ const d = idx.us.filter(u => u.aid.endsWith('-diario')).slice(-6); for (const u of d) out.push({ ...u, t: u.t.slice(0, 6000) }); }
    return out;
  },
  async achar(aid, q) {
    const d = await kvGet('autos:' + aid); if (!d) return [];
    const qn = semAcento(q).trim(); if (qn.length < 2) return [];
    const res = [];
    d.pages.forEach((t, i) => { const tn = semAcento(t); const k = tn.indexOf(qn); if (k >= 0) { let c = 0, j = k; while (j >= 0) { c++; j = tn.indexOf(qn, j + qn.length); } res.push({ pag: i + 1, c, snip: t.slice(Math.max(0, k - 90), k + qn.length + 140) }); } });
    return res;
  }
};

}
async function openVersions() {
  closeSheet(); openSheet('Versões anteriores', () => `<div id="ver-list" class="stack"><p class="muted">Buscando no cofre…</p></div>`);
  try {
    const cs = await Nuvem.commits('vault.json'); const box = $('#ver-list'); if (!box) return;
    box.innerHTML = cs.length ? `<p class="muted small" style="margin:0">Cada linha é uma versão salva. Voltar uma versão não apaga a atual.</p><ul class="list">${cs.map((c, i) => `<li><button class="row-btn" data-act="ver-restore" data-sha="${esc(c.sha)}" ${i === 0 ? 'disabled' : ''}><span class="rb-main"><b>${fmtDate(c.commit.author.date)} às ${fmtTime(c.commit.author.date)}${i === 0 ? ' · atual' : ''}</b><span class="muted small">${esc(c.commit.message)}</span></span></button></li>`).join('')}</ul>` : '<p class="muted">Nenhuma versão ainda.</p>';
  } catch (e) { const box = $('#ver-list'); if (box) box.innerHTML = '<p class="err">Não consegui buscar as versões agora.</p>'; }
}
async function restoreVersion(sha) {
  if (!await askConfirm('Voltar os dados pra essa versão? A versão de agora continua salva no histórico.', 'Voltar pra essa versão', false)) return;
  try { const v = JSON.parse(TD.decode(await Nuvem.raw('vault.json', sha))); S = JSON.parse(TD.decode(await decBytes(Vault.key, unb64(v.data)))); migrate(); S.meta.updatedAt = new Date().toISOString(); await save({ silent: true }); closeSheet(); render(); await Vault.sync(); toast('Versão restaurada'); }
  catch (e) { toast('Não consegui restaurar essa versão.'); }
}
async function disconnectVault() {
  if (!await askConfirm('Desconectar o cofre deste aparelho? Os dados continuam aqui e no GitHub; só para de sincronizar e desliga a trava.', 'Desconectar')) return;
  try { await Store.del('vault'); } catch (_) {}
  Lock.cfg.mode = 'none'; await Lock.persist(); Vault.cfg = null; Vault.key = null; Nuvem.cfg = null; closeSheet(); render(); toast('Cofre desconectado deste aparelho');
}

/* ---------- Ajustes ---------- */
let AJ = { robo: null, push: null, keyBusy: false, keyErr: '' };
function openSettings() {
  closeSheet(); AJ = { robo: Robo.estado, push: null, keyBusy: false, keyErr: '' };
  openSheet('Ajustes', settingsBody, { full: true });
  (async () => { AJ.push = await Robo.ligado(); if (Vault.cfg && Vault.key) AJ.robo = await Robo.lerEstado(); if (sheetBody === settingsBody) refreshSheet(); })();
}
function settingsBody() {
  const st = S.settings, L = Lock.cfg, cofre = !!Vault.cfg, bl = Bio.label();
  const gpt = st.openaiKey ? `<section class="card stack"><div class="row between"><b>GPT (OpenAI)</b><span class="chip ok">Ligado</span></div>
      <p class="small muted" style="margin:0">Modelo: <b style="color:var(--ink)">${esc(st.modelo || '—')}</b></p>
      <div class="seg" role="group" aria-label="Modelo"><button data-act="ia-tipo" data-v="mini" aria-pressed="${st.tipoModelo !== 'melhor'}">Econômico</button><button data-act="ia-tipo" data-v="melhor" aria-pressed="${st.tipoModelo === 'melhor'}">Mais caprichado</button></div>
      <label class="set-row"><span>Refazer o resumo sozinho quando sair novidade</span><input type="checkbox" class="switch" data-act="ia-auto" ${st.autoIA !== false ? 'checked' : ''}></label>
      <div class="row"><button class="btn small" data-act="ia-key-off" style="color:var(--coral)">Remover chave</button></div>
      <p class="tiny muted" style="margin:0">O que você pergunta vai pra OpenAI junto com os trechos dos autos que respondem a pergunta.</p></section>`
    : `<section class="card stack"><div class="row between"><b>GPT (OpenAI)</b><span class="chip bad">Sem chave</span></div>
      <form data-form="ia-key" class="stack" autocomplete="off"><input id="ia-key" class="input" type="password" placeholder="sk-…" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${AJ.keyErr ? `<p class="err">${esc(AJ.keyErr)}</p>` : ''}<button class="btn primary block" type="submit" ${AJ.keyBusy ? 'disabled' : ''}>${AJ.keyBusy ? 'Testando…' : 'Salvar e testar'}</button></form>
      <details class="small muted"><summary>Onde pego a chave</summary><ol style="padding-left:18px;margin:8px 0 0;line-height:1.5"><li>platform.openai.com › entre com a sua conta.</li><li>Settings › Billing: ponha um crédito (US$ 5 dura muito).</li><li>API keys › Create new secret key › copie e cole aqui.</li></ol><p style="margin:8px 0 0">A chave fica só neste aparelho e no seu cofre, criptografada.</p></details></section>`;
  const robo = AJ.robo;
  const roboTxt = !cofre ? 'Precisa do cofre ligado.' : !robo ? 'O robô ainda não rodou (ele confere o Diário 4 vezes por dia).' : robo.erro ? `Robô com problema: ${esc(robo.erro)}` : `Robô conferiu ${quando(robo.rodou)}${robo.avisos ? ' · ' + plural(robo.avisos, 'aviso mandado', 'avisos mandados') : ''}.`;
  const notif = `<section class="card stack"><div class="row between"><b>Notificações</b><span class="chip ${AJ.push ? 'ok' : 'bad'}">${AJ.push ? 'Ligadas' : AJ.push === null ? '…' : 'Desligadas'}</span></div>
      <p class="small muted" style="margin:0">Saiu movimentação nova → aviso no celular → toque e abre direto no processo, com a decisão.</p>
      <p class="small" style="margin:0">${roboTxt}</p>
      ${!AJ.push ? `<button class="btn primary block" data-act="push-on">${ico('bell', 18)} Ligar notificações neste aparelho</button>${/iPhone|iPad/.test(navigator.userAgent) && !Robo.instalado() ? '<p class="tiny muted" style="margin:0">No iPhone só funciona com o app na Tela de Início (Safari › Compartilhar › Adicionar à Tela de Início).</p>' : ''}` : `<button class="btn small" data-act="push-on">Religar neste aparelho</button>`}</section>`;
  const cofreCard = !cofre ? `<section class="card stack"><div class="row between"><b>Cofre na nuvem</b><span class="chip bad">Desligado</span></div>
      <p class="small" style="margin:0">Os processos estão <b>só neste aparelho</b>. Ligue o cofre: vai tudo criptografado pro seu GitHub privado, sincroniza iPhone e Mac e é por onde os autos transcritos chegam.</p>
      <button class="btn primary block" data-act="vault-setup">${ico('shield', 18)} Ligar o cofre</button></section>`
    : `<section class="card stack"><div class="row between"><b>Cofre na nuvem</b><span class="chip ${Vault.cfg.error ? 'bad' : 'ok'}">${Vault.cfg.error ? 'Atenção' : 'Ligado'}</span></div>
      <p class="small" style="margin:0"><span data-vault-status>${esc(Vault.statusText())}</span><br><span class="muted">${esc(Vault.cfg.repo)} · criptografado (AES-256)</span></p>
      <div class="row"><button class="btn primary" style="flex:1" data-act="vault-sync">${ico('refresh', 17)} Sincronizar</button><button class="btn" style="flex:1" data-act="vault-versions">Versões</button></div>
      <button class="btn" data-act="vault-setup">Trocar chave</button>
      <button class="btn ghost" style="color:var(--coral)" data-act="vault-off">Desconectar deste aparelho</button></section>`;
  const opt = (v, label, dis) => `<button type="button" data-act="lock-mode" data-v="${v}" aria-pressed="${L.mode === v}" ${dis ? 'disabled' : ''}>${label}</button>`;
  const trava = `<section class="card stack"><b>Trava do app <span class="muted small">(só este aparelho)</span></b><div class="seg" role="group" aria-label="Trava">${opt('none', 'Nenhuma', false)}${opt('bio', bl, !cofre || !Lock.bioOk)}${opt('pin', 'PIN', !cofre)}</div>
      ${!cofre ? `<p class="muted small" style="margin:0">Pra usar ${bl} ou PIN, ligue o cofre antes.</p>` : L.mode === 'none' ? `<p class="muted small" style="margin:0">Recomendado: tem processo de família aqui.</p>` : ''}</section>`;
  return `${gpt}${notif}${cofreCard}${trava}
    <section class="card stack"><b>App</b><p class="small muted" style="margin:0">Versão ${APP_VERSION} · atualiza sozinho ao abrir.</p>
      <button class="btn small" data-act="app-check" style="align-self:flex-start">Procurar atualização</button>
      <details class="small muted"><summary>Plano B: receber arquivo</summary><p style="margin:8px 0">Se o Claude te mandar um pacote .json no chat, escolha aqui.</p><input type="file" id="pack-file" accept=".json,application/json" class="small"></details></section>`;
}
async function saveKey() {
  const k = ($('#ia-key').value || '').trim();
  if (!/^sk-/.test(k)) { AJ.keyErr = 'A chave começa com "sk-". Cole ela inteira.'; return refreshSheet(); }
  AJ.keyBusy = true; AJ.keyErr = ''; refreshSheet();
  try {
    const ids = await oaiModels(k);
    S.settings.openaiKey = k; S.settings.modelos = ids.filter(id => /^gpt-/.test(id)).slice(0, 80);
    S.settings.modelo = escolheModelo(ids, S.settings.tipoModelo); await save();
    AJ.keyBusy = false; refreshSheet(); toast(`GPT ligado · ${esc(S.settings.modelo)}`);
    for (const p of S.processos) {
      if (!p.fonteResumo) await iaAtualizar(p, { inicial: true }).catch(() => {}); /* adicionado sem chave: escreve o 1º resumo */
      else if ((p.pendIA || []).length) await iaAtualizar(p).catch(() => {});
    }
  } catch (e) { AJ.keyBusy = false; AJ.keyErr = e.code === 'key' ? 'A OpenAI não aceitou essa chave.' : 'Não consegui testar agora. Confira a internet.'; refreshSheet(); }
}
async function packFromFile(file) {
  try { const pack = JSON.parse(await file.text()); if (pack.app !== APP_ID || pack.kind !== 'pacote') throw new Error('formato'); const lab = await mergePack(pack); migrate(); await save(); closeSheet(); render(); toast(`Recebido: ${esc(lab)}`, 3600); }
  catch (e) { toast('Esse arquivo não é um pacote do Processos de Bolso.'); }
}

/* ---------- atualização do app (sozinha ao abrir) ---------- */
const AppUpd = { info: null, busy: false };
const verNum = v => String(v || '0').split('.').map(n => parseInt(n, 10) || 0);
function isNewer(a, b) { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function checkUpdate(manual) {
  if (PREVIEW || !navigator.onLine) { if (manual) toast('Sem internet agora.'); return; }
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (isNewer(j.version, APP_VERSION)) { AppUpd.info = j; if ($('#sheet-root').hidden && !CH) return applyUpdate(); render(); if (manual) toast(`Versão ${esc(j.version)} disponível`); }
    else { AppUpd.info = null; if (manual) toast(`Você já está na versão mais nova (${APP_VERSION})`); }
  } catch (_) { if (manual) toast('Não consegui verificar agora.'); }
}
async function applyUpdate() {
  if (AppUpd.busy) return; AppUpd.busy = true; toast('Atualizando o app…', 6000);
  try { if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { try { await reg.update(); } catch (_) {} if (reg.waiting) reg.waiting.postMessage('skip'); } } if (window.caches) { for (const k of await caches.keys()) await caches.delete(k); } } catch (_) {}
  location.reload();
}
const updBanner = () => AppUpd.info ? `<button class="banner" data-act="app-update">${ico('refresh', 18)}<p><b>Versão nova ${esc(AppUpd.info.version)}.</b> Toque pra atualizar (seus dados não mudam).</p></button>` : '';

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'close-sheet') return closeSheet();
  if (a === 'open') return openProc(el.dataset.id);
  if (a === 'home') { UI.view = 'home'; render(); window.scrollTo(0, 0); return; }
  if (a === 'refresh') return refreshAll({ manual: true });
  if (a === 'refresh-one') return refreshAll({ manual: true, only: UI.pid });
  if (a === 'add') return openAdd();
  if (a === 'edit-proc') return openEdit();
  if (a === 'ed-ico') { ED.icone = el.dataset.v; ED.titulo = $('#ed-titulo').value; ED.nums = $('#ed-nums').value; return refreshSheet(); }
  if (a === 'del-proc') return delProc();
  if (a === 'historico') return openHistorico();
  if (a === 'movs-all') { UI.movsAll = !UI.movsAll; return render(); }
  if (a === 'copy-num') { try { await navigator.clipboard.writeText(el.dataset.v); toast('Número copiado'); } catch (_) {} return; }
  if (a === 'chat') return openChat();
  if (a === 'chat-q') return chatSend(el.dataset.q);
  if (a === 'chat-clear') { const p = proc(CH.pid); if (p && await askConfirm('Apagar a conversa deste processo?', 'Apagar')) { p.chat = []; touch(p); await save(); refreshSheet(); } return; }
  if (a === 'autos') return openReader(el.dataset.aid);
  if (a === 'ver-pag') return openReader(el.dataset.aid, +el.dataset.pag);
  if (a === 'rd-pag') { const n = +el.dataset.v; if (RD && n >= 1 && n <= RD.doc.pages.length) { RD.pag = n; refreshSheet(); $('#sheet-body').scrollTop = 0; } return; }
  if (a === 'rd-lista') { RD.pag = null; return refreshSheet(); }
  if (a === 'settings') return openSettings();
  if (a === 'vault-setup') return openVaultSetup();
  if (a === 'vault-sync') { await Vault.sync(); refreshSheet(); return toast(Vault.cfg && Vault.cfg.error ? esc(Vault.cfg.error) : 'Sincronizado'); }
  if (a === 'vault-versions') return openVersions();
  if (a === 'ver-restore') return restoreVersion(el.dataset.sha);
  if (a === 'vault-off') return disconnectVault();
  if (a === 'lock-mode') return setLockMode(el.dataset.v);
  if (a === 'lock-bio') return bioUnlock(false);
  if (a === 'lock-forgot') return showLock('forgot');
  if (a === 'push-on') return Robo.ativar();
  if (a === 'ia-tipo') { S.settings.tipoModelo = el.dataset.v; S.settings.modelo = escolheModelo(S.settings.modelos || [], el.dataset.v); await save(); refreshSheet(); return toast(`Modelo: ${esc(S.settings.modelo)}`); }
  if (a === 'ia-key-off') { if (await askConfirm('Remover a chave da OpenAI deste app (e do cofre)?', 'Remover')) { S.settings.openaiKey = ''; await save(); refreshSheet(); } return; }
  if (a === 'app-check') return checkUpdate(true);
  if (a === 'app-update') return applyUpdate();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'ia-auto') { S.settings.autoIA = el.checked; save(); }
  if (el.id === 'pack-file' && el.files && el.files[0]) packFromFile(el.files[0]);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'add') return addSubmit();
  if (k === 'edit') return editSubmit();
  if (k === 'chat') { const i = $('#chat-in'); const q = i.value; i.value = ''; return chatSend(q); }
  if (k === 'rd-busca') { RD.q = $('#rd-q').value.trim(); RD.pag = null; (async () => { RD.res = RD.q.length > 1 ? await Busca.achar(RD.aid, RD.q) : null; refreshSheet(); })(); return; }
  if (k === 'vault-1') return vaultStep1();
  if (k === 'vault-2') return vaultStep2();
  if (k === 'unlock') return tryUnlock();
  if (k === 'ia-key') return saveKey();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'chat-in') { e.preventDefault(); const q = e.target.value; e.target.value = ''; chatSend(q); }
  if (e.key === 'Escape' && !$('#sheet-root').hidden) closeSheet();
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'chat-in') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (Lock.active() && !Vault.locked) Lock.touch(); return; }
  if (Lock.active() && !Vault.locked && Lock.expired()) showLock();
  Vault.schedule(600);
  const t = Upd.lastAll ? Date.parse(Upd.lastAll) : 0;
  if (Date.now() - t > 30 * 60000) refreshAll();
  checkUpdate();
});
window.addEventListener('online', () => { Vault.schedule(500); });

/* ---------- início ---------- */
async function boot() {
  const vv = window.visualViewport; /* teclado do iPhone não cobre a caixa de pergunta */
  if (vv) { const kb = () => document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) + 'px'); vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {} /* pede pro navegador não apagar os dados do aparelho */
  try { S = await kvGet('state'); } catch (_) { S = null; }
  migrate();
  Upd.lastAll = (await kvGet('ultimaConsulta')) || null;
  await Vault.init(); await Lock.init();
  const qp = new URLSearchParams(location.search).get('p');
  if (qp && proc(qp)) { UI.view = 'proc'; UI.pid = qp; }
  render(); badge();
  if (Lock.active()) showLock(); else if (Vault.cfg && !Vault.key) showLock('password');
  if (!PREVIEW && 'serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('sw.js'); } catch (_) {}
    navigator.serviceWorker.addEventListener('message', ev => { const id = ev.data && ev.data.open; if (id && proc(id)) { openProc(id); refreshAll({ only: id }); } });
  }
  if (PREVIEW) return;
  if (Vault.cfg && Vault.key) await Vault.sync().catch(() => {});
  if (qp && proc(qp)) { openProc(qp); refreshAll({ only: qp }); }
  else if (!Upd.lastAll || Date.now() - Date.parse(Upd.lastAll) > 20 * 60000) refreshAll();
  if (Vault.cfg && Vault.key) Robo.lerEstado();
  checkUpdate(); setInterval(() => checkUpdate(), 30 * 60000);
}
boot();
</script>
</body>
</html>
